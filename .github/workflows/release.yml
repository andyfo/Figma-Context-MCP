name: Release

# WP Godmode's fork releases on GitHub instead of npm. A `vX.Y.Z` tag runs the
# same checks as CI, builds, and attaches the `npm pack` tarball to a GitHub
# Release. Consumers install it by URL and their lockfile pins its sha512, so
# no registry account or token is involved beyond this workflow's own.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload the tarball

jobs:
  release:
    name: Check, build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Scan for hidden characters
        run: node scripts/scan-hidden-chars.mjs

      - name: Check formatting
        run: pnpm prettier --check "src/**/*.ts"

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build and pack
        id: pack
        run: |
          pnpm build
          npm pack --ignore-scripts --json > pack.json
          echo "file=$(jq -r '.[0].filename' pack.json)" >> "$GITHUB_OUTPUT"
          echo "integrity=$(jq -r '.[0].integrity' pack.json)" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.pack.outputs.file }}
          INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${FILE}"
          {
            echo "Install: \`npm install ${URL}\`"
            echo
            echo "sha512 that package-lock.json records as \`integrity\`: \`${INTEGRITY}\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$FILE" --title "$GITHUB_REF_NAME" --notes-file notes.md
